name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: cthuwu
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - name: Install operator search dependency
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout="15"
            sudo apt-get install -y --no-install-recommends ripgrep
          fi
      - run: python3 ../scripts/test_workspace.py
      - run: python3 ../scripts/test_code.py
      - run: python3 ../scripts/test_release_entrypoint.py
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: bash ../scripts/smoke-uwu.sh

  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: bash ../scripts/test-uwu.sh
      - run: bash ../scripts/test-install.sh

  erc8004-mainnet-fork:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - run: npm ci
      - name: Exercise canonical Base ERC-8004 registration and recovery
        shell: bash
        run: |
          set -euo pipefail
          anvil \
            --fork-url https://mainnet.base.org \
            --fork-block-number 41663800 \
            --chain-id 8453 \
            --host 127.0.0.1 \
            --port 8545 \
            --silent \
            >"${RUNNER_TEMP}/cthuwu-anvil.log" 2>&1 &
          anvil_pid=$!
          cleanup() {
            kill "${anvil_pid}" 2>/dev/null || true
            wait "${anvil_pid}" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent \
              --header 'content-type: application/json' \
              --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' \
              http://127.0.0.1:8545 >/dev/null; then
              break
            fi
            if ! kill -0 "${anvil_pid}" 2>/dev/null; then
              sed -n '1,120p' "${RUNNER_TEMP}/cthuwu-anvil.log"
              exit 1
            fi
            if [[ "${attempt}" == 60 ]]; then
              sed -n '1,120p' "${RUNNER_TEMP}/cthuwu-anvil.log"
              exit 1
            fi
            sleep 1
          done
          npm run test:erc8004-mainnet-fork

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: contracts
    env:
      FOUNDRY_PROFILE: ci
      BASE_RPC_URL: https://mainnet.base.org
      BASE_MAINNET_RPC_URL: https://mainnet.base.org
      BASE_MAINNET_FORK_BLOCK: "49768180"
      BASE_MAINNET_FORK_BLOCK_HASH: "0xcb6c8ff16f2b240137013b793b06f3d2ac1133b192f36920062c1b8c6e307c0e"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - name: Verify exact Foundry dependencies
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(forge --version | sed -n '1p')" =~ ^forge[[:space:]]Version:[[:space:]]1\.7\.1([-+][^[:space:]]+)?$ ]]
          test "$(git -C lib/openzeppelin-contracts rev-parse HEAD)" = \
            e4f70216d759d8e6a64144a9e1f7bbeed78e7079
          test "$(git -C lib/openzeppelin-contracts rev-parse 'HEAD^{tree}')" = \
            48a8de6b15f3c4f708072626d7646390674a93b8
          test "$(git -C lib/forge-std rev-parse HEAD)" = \
            620536fa5277db4e3fd46772d5cbc1ea0696fb43
          test "$(git -C lib/forge-std rev-parse 'HEAD^{tree}')" = \
            7a87f9b3d611ddb4475c1e883c79b0d5a4693be4
          test -z "$(git -C lib/openzeppelin-contracts status --porcelain=v1 --untracked-files=all)"
          test -z "$(git -C lib/forge-std status --porcelain=v1 --untracked-files=all)"
      - run: forge fmt --check
      - run: forge lint
      - run: forge build --sizes
      - run: forge test -vvv
      - name: Validate deployment tooling syntax
        run: |
          bash -n scripts/deploy-base.sh
          node --experimental-strip-types --check scripts/estimate-deployment-funding.ts

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install pinned Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser E2E and Lighthouse accessibility gates
        run: npm run test:browser
      - name: Upload browser quality reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: web-browser-quality
          path: |
            web/test-results/lighthouse
            web/test-results/playwright
          if-no-files-found: ignore

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag cthuwu:test .
