name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # All VITE_* values are compiled into static JavaScript and are public.
      VITE_CTHUWU_GRAPHQL_ENDPOINT: ${{ vars.CTHUWU_GRAPHQL_ENDPOINT }}
      VITE_CTHUWU_GRAPH_API_KEY: ${{ vars.CTHUWU_GRAPH_API_KEY }}
      VITE_CTHUWU_BASE_RPC_ENDPOINT: ${{ vars.CTHUWU_BASE_RPC_ENDPOINT }}
      VITE_CTHUWU_IPFS_GATEWAY: ${{ vars.CTHUWU_IPFS_GATEWAY }}
      VITE_CTHUWU_ARWEAVE_GATEWAY: ${{ vars.CTHUWU_ARWEAVE_GATEWAY }}
      VITE_CTHUWU_LEADERBOARD_FRESH_MS: ${{ vars.CTHUWU_LEADERBOARD_FRESH_MS }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
        working-directory: web
      - name: Require production leaderboard configuration
        run: npm run validate:production-config
        working-directory: web
      - run: npm test -- --run
        working-directory: web
      - run: npm run build
        working-directory: web
        # Restrict the public Graph key by cthuwu.app origin, exact Agent0 subgraph, spending limit,
        # monitoring, and rotation. Missing or unresolved config blocks this deployment above.
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
