[package]
name = "cthuwu-protocol"
version = "0.1.0"
edition = "2024"
description = "Transport-independent coordination types for Tentacles composing Cthuwu"
license = "Apache-2.0"

[features]
default = []
# Explicitly non-cryptographic helpers for deterministic tests and the local simulator only.
test-signer = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[lints.rust]
unsafe_code = "forbid"
