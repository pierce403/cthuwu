[package]
autobins = false
name = "cthuwu"
version = "0.1.0"
edition = "2024"
description = "A local eldritch companion that talks over XMTP"
license = "Apache-2.0"

[workspace]
members = [".", "crates/cthuwu-protocol", "crates/cthuwu-council"]
resolver = "3"

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
cthuwu-council = { path = "crates/cthuwu-council" }
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[[bin]]
name = "uwubot"
path = "src/main.rs"
