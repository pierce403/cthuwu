[package]
name = "cthuwu"
version = "0.1.0"
edition = "2024"
description = "A local eldritch companion that talks over XMTP"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "uwubot"
path = "src/main.rs"
