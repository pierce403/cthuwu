specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: IdentityRegistry
    network: base
    source:
      address: "0x8004A169FB4a3325136EB29fA0ceB6D2e539a432"
      abi: IdentityRegistry
      startBlock: 41663783
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Tentacle
        - Wallet
        - TentacleMetadata
        - OperatorApproval
        - TentacleProfile
      abis:
        - name: IdentityRegistry
          file: ./abis/IdentityRegistry.json
      eventHandlers:
        - event: Registered(indexed uint256,string,indexed address)
          handler: handleRegistered
        - event: URIUpdated(indexed uint256,string,indexed address)
          handler: handleURIUpdated
        - event: MetadataSet(indexed uint256,indexed string,string,bytes)
          handler: handleMetadataSet
        - event: Transfer(indexed address,indexed address,indexed uint256)
          handler: handleTransfer
        - event: Approval(indexed address,indexed address,indexed uint256)
          handler: handleApproval
        - event: ApprovalForAll(indexed address,indexed address,bool)
          handler: handleApprovalForAll
      file: ./src/identity.ts
  - kind: ethereum
    name: UWU
    network: base
    source:
      address: "0x9dBa3AE7002DaEfd7324e7B9f829ed31Cb5f0B07"
      abi: UWU
      startBlock: 49768171
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Wallet
      abis:
        - name: UWU
          file: ./abis/UWU.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
      file: ./src/uwu.ts
  - kind: ethereum
    name: ReputationRegistry
    network: base
    source:
      address: "0x8004BAa17C55a88189AE136b182e5fdA19dE9b63"
      abi: ReputationRegistry
      startBlock: 41663784
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Tentacle
        - Feedback
        - FeedbackResponse
      abis:
        - name: ReputationRegistry
          file: ./abis/ReputationRegistry.json
      eventHandlers:
        - event: NewFeedback(indexed uint256,indexed address,uint64,int128,uint8,indexed string,string,string,string,string,bytes32)
          handler: handleNewFeedback
        - event: FeedbackRevoked(indexed uint256,indexed address,indexed uint64)
          handler: handleFeedbackRevoked
        - event: ResponseAppended(indexed uint256,indexed address,uint64,indexed address,string,bytes32)
          handler: handleResponseAppended
      file: ./src/reputation.ts
templates:
  - kind: file/ipfs
    name: IpfsTentacleProfile
    mapping:
      kind: file/ipfs
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/profile.ts
      handler: handleProfile
      entities:
        - TentacleProfile
      abis:
        - name: IdentityRegistry
          file: ./abis/IdentityRegistry.json
  - kind: file/arweave
    name: ArweaveTentacleProfile
    mapping:
      kind: file/arweave
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/profile.ts
      handler: handleProfile
      entities:
        - TentacleProfile
      abis:
        - name: IdentityRegistry
          file: ./abis/IdentityRegistry.json
