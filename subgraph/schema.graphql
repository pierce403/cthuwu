"A current ERC-8004 identity. Membership is current exact allegiance, never token possession."
type Tentacle @entity(immutable: false) {
  "Decimal ERC-8004 agent ID."
  id: ID!
  agentId: BigInt!
  owner: Bytes!
  approvedOperator: Bytes!
  agentURI: String!
  agentWallet: Bytes!
  wallet: Wallet
  allegiance: Bytes!
  protocol: Bytes!
  tentacleId: String
  isTentacle: Boolean!
  isWalletVerified: Boolean!
  registrationBlock: BigInt!
  registrationTimestamp: BigInt!
  registrationTransaction: Bytes!
  profileUpdatedBlock: BigInt!
  profileUpdatedTimestamp: BigInt!
  metadataUpdatedBlock: BigInt!
  metadataUpdatedTimestamp: BigInt!
  feedbackCount: BigInt!
  activeFeedbackCount: BigInt!
  revokedFeedbackCount: BigInt!
  profile: TentacleProfile
  metadata: [TentacleMetadata!]! @derivedFrom(field: "tentacle")
  feedbacks: [Feedback!]! @derivedFrom(field: "tentacle")
}

"Exact current raw UWU balance for a unique Base wallet."
type Wallet @entity(immutable: false) {
  "Lowercase 20-byte address."
  id: ID!
  address: Bytes!
  rawBalance: BigInt!
  updatedBlock: BigInt!
  updatedTimestamp: BigInt!
  tentacles: [Tentacle!]! @derivedFrom(field: "wallet")
}

"Current bounded value for one Cthuwu metadata key."
type TentacleMetadata @entity(immutable: false) {
  "<agentId>:<metadata-key>."
  id: ID!
  tentacle: Tentacle!
  key: String!
  value: Bytes!
  valueTooLarge: Boolean!
  updatedBlock: BigInt!
  updatedTimestamp: BigInt!
  updatedTransaction: Bytes!
}

"Current ERC-721 operator-for-all approval. This is informational, not membership."
type OperatorApproval @entity(immutable: false) {
  "<owner>:<operator>, both lowercase."
  id: ID!
  owner: Bytes!
  operator: Bytes!
  approved: Boolean!
  updatedBlock: BigInt!
  updatedTimestamp: BigInt!
  updatedTransaction: Bytes!
}

"Public feedback with source provenance; no unfiltered aggregate is authoritative."
type Feedback @entity(immutable: false) {
  "<agentId>:<clientAddress>:<feedbackIndex>."
  id: ID!
  tentacle: Tentacle!
  clientAddress: Bytes!
  feedbackIndex: BigInt!
  value: BigInt!
  valueDecimals: Int!
  tag1: String!
  tag2: String!
  endpoint: String!
  feedbackURI: String!
  feedbackHash: Bytes!
  fieldsRejected: Boolean!
  isRevoked: Boolean!
  createdBlock: BigInt!
  createdTimestamp: BigInt!
  createdTransaction: Bytes!
  createdLogIndex: BigInt!
  revokedBlock: BigInt
  revokedTimestamp: BigInt
  revokedTransaction: Bytes
  revokedLogIndex: BigInt
  revocationProvenance: String
  provenance: String!
  responses: [FeedbackResponse!]! @derivedFrom(field: "feedback")
}

"A public response appended to one feedback record."
type FeedbackResponse @entity(immutable: true) {
  "Transaction hash plus log index."
  id: ID!
  feedback: Feedback!
  responder: Bytes!
  responseURI: String!
  responseHash: Bytes!
  blockNumber: BigInt!
  timestamp: BigInt!
  transaction: Bytes!
  logIndex: BigInt!
  provenance: String!
}

"Bounded immutable registration-v1 fields parsed only from IPFS or Arweave."
type TentacleProfile @entity(immutable: true) {
  "ipfs:<cid> or ar:<transaction-id>."
  id: ID!
  sourceURI: String!
  contentHash: Bytes!
  byteLength: Int!
  parseValid: Boolean!
  schemaType: String
  name: String
  description: String
  image: String
  active: Boolean
  x402Support: Boolean
  xmtpEndpoint: String
  cthuwuEndpoint: String
  serviceCount: Int
  registrationCount: Int
}
